name: CheatMode
version: ${project.version}
main: fr.cheatmode.CheatModePlugin
api-version: '1.21'
description: Mode "cheat" pour ton propre serveur (fly, killaura, x-ray, -gm ...)
commands:
  cheatmode:
    description: Ouvre l'aide de CheatMode (les commandes se tapent aussi dans le chat avec "-")
    aliases: [cm]
    permission: cheatmode.use
permissions:
  cheatmode.use:
    description: Autorise l'utilisation du mode cheat
    default: op
